[project]
name = "kl-clustering-analysis"
version = "0.1.0"
description = "KL-divergence based hierarchical clustering analysis with NetworkX and advanced visualization"
requires-python = ">=3.11"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"

dependencies = [
    "joblib>=1.3.0",
    "numpy>=1.24.0,<2.4",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "plotly>=5.24.0",
    "seaborn>=0.13.0",
    "pydiffmap>=0.2.0.1",
    "scikit-learn>=1.3.0",
    "networkx>=3.1",
    "scikit-image>=0.22.0",
    "numba>=0.59.0",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipython>=8.12.0",
    "notebook>=7.0.0",
    "pytest>=7.4.0",
    "radon",
    "lizard",
    "xenon",
    "wily",
]
benchmark = [
    "leidenalg>=0.10.0",
    "igraph>=0.10.0",
    "python-louvain>=0.16",
    "hdbscan>=0.8.41",
]
viz = [
    "scikit-bio>=0.6.0",
    "umap-learn>=0.5.11",
    "kaleido>=0.2.1",
    "pypdf>=5.0.0",
]
all = [
    "jupyter>=1.0.0",
    "ipython>=8.12.0",
    "notebook>=7.0.0",
    "pytest>=7.4.0",
    "radon",
    "lizard",
    "xenon",
    "wily",
    "leidenalg>=0.10.0",
    "igraph>=0.10.0",
    "python-louvain>=0.16",
    "hdbscan>=0.8.41",
    "scikit-bio>=0.6.0",
    "umap-learn>=0.5.11",
    "kaleido>=0.2.1",
    "pypdf>=5.0.0",
]

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running integration and regression coverage",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["benchmarks", "kl_clustering_analysis", "scripts", "tests"]
force-exclude = true
extend-exclude = [
    "debug_scripts",
    "manuscript",
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "E501"]

[tool.deptry]
ignore_notebooks = true
known_first_party = ["benchmarks", "kl_clustering_analysis"]
pep621_dev_dependency_groups = ["dev", "benchmark", "viz", "all"]
extend_exclude = ["^debug_scripts/", "^manuscript/", "^notebooks/"]
package_module_name_map = { "python-louvain" = "community", "scikit-bio" = "skbio" }
