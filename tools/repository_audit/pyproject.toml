[project]
name = "tbs-repository-audit"
version = "0.1.0"
description = "Evidence-based repository hygiene audits for Tree-Break Selection"
requires-python = ">=3.11,<3.14"
dependencies = [
    "coverage[toml]>=7.10",
    "grimp>=3.14",
    "mutmut>=3.4",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-deadfixtures>=3.0",
    "pytest-testmon>=2.1",
    "ruff>=0.15",
    "semgrep>=1.100",
    "vulture>=2.14",
]

[project.scripts]
tbs-audit = "tbs_repo_audit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tbs_repo_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

